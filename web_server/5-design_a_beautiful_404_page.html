<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --sky: #7fb2dc;
    --sky-deep: #4f8cc2;
    --cloud: #ffffff;
    --ink: #1d2b3a;
    --paper: #fbfaf4;
    --apple: #4d7d3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 55%, #bcdcf1 100%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
  }
  .clouds { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; text-align: center; max-width: 34rem; }
  .paper {
    width: min(220px, 55vw);
    height: auto;
    margin: 0 auto 8px;
    display: block;
    animation: drift 6s ease-in-out infinite;
    filter: drop-shadow(0 18px 14px rgba(20, 45, 75, 0.25));
  }
  .code {
    margin: 0;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--paper);
  }
  h1 {
    margin: 6px 0 14px;
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-style: italic;
    font-weight: 400;
    line-height: 1.15;
    color: var(--paper);
    text-shadow: 0 2px 0 rgba(20, 45, 75, 0.25);
  }
  p.note {
    margin: 0 auto 26px;
    max-width: 28rem;
    font-size: 1.1rem;
    line-height: 1.6;
    color: var(--ink);
  }
  a.home {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--apple);
    color: #fff;
    font-family: system-ui, "Segoe UI", sans-serif;
    font-size: 1rem;
    text-decoration: none;
    border: 2px solid var(--paper);
    transition: transform 0.15s ease;
  }
  a.home:hover { transform: translateY(-2px); }
  a.home:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .paper { animation: none; transform: rotate(-3deg); }
    a.home { transition: none; }
  }
</style>
</head>
<body>
  <svg class="clouds" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="#ffffff" opacity="0.92">
      <ellipse cx="190" cy="150" rx="120" ry="38"/><ellipse cx="260" cy="125" rx="80" ry="34"/><ellipse cx="120" cy="135" rx="70" ry="30"/>
      <ellipse cx="980" cy="260" rx="150" ry="42"/><ellipse cx="1060" cy="232" rx="90" ry="36"/><ellipse cx="900" cy="240" rx="80" ry="32"/>
      <ellipse cx="260" cy="640" rx="170" ry="46"/><ellipse cx="350" cy="610" rx="100" ry="40"/><ellipse cx="160" cy="620" rx="90" ry="34"/>
      <ellipse cx="1000" cy="680" rx="130" ry="38"/><ellipse cx="1070" cy="655" rx="80" ry="32"/>
    </g>
  </svg>

  <main>
    <svg class="paper" viewBox="0 0 220 280" role="img" aria-label="A blank sheet of paper drawn with a dashed outline">
      <path d="M20 10 H160 L205 55 V268 H20 Z" fill="#fbfaf4" stroke="#1d2b3a" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
      <path d="M160 10 V55 H205" fill="#e6e3d3" stroke="#1d2b3a" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
      <text x="112" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#1d2b3a" opacity="0.18">404</text>
    </svg>
    <p class="code">Erreur 404</p>
    <h1>Ceci n'est pas une page</h1>
    <p class="note">This is not a page. The address you typed leads nowhere, but the home page is one click away.</p>
    <a class="home" href="/">Go to the home page</a>
  </main>
</body>
</html>
